<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/png" href="/logo.png" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
            rel="stylesheet"
        />
        <title>Koel</title>
        <script>
            // Apply the saved (or system) theme before the page paints, so a dark
            // theme never flashes light first. Keep the key in sync with src/lib/theme.ts.
            (function () {
                try {
                    var saved = localStorage.getItem("koel-theme");
                    var isDark = saved
                        ? saved === "dark"
                        : window.matchMedia("(prefers-color-scheme: dark)")
                              .matches;
                    if (isDark) document.documentElement.classList.add("dark");
                } catch (error) {
                    // Storage blocked: fall back to the light theme.
                }
            })();
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
